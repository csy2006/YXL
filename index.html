<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量加白边并署名</title>
<style>
  :root {
    --border: #d9d9d9;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --bg: #ffffff;
    --bg2: #fafafa;
    --accent: #1f1f1f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 32px; }

  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg2);
    padding: 28px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 16px; }

  .drop {
    border: 1.5px dashed #c9c9c9;
    border-radius: 10px;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .drop:hover, .drop.over { background: #fff; border-color: #a0a0a0; }
  .drop b { color: var(--text); }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .row label { font-size: 14px; flex: 0 0 auto; }
  input[type="text"], input[type="number"] {
    width: 100%; max-width: 320px; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 14px; background: #fff; color: var(--text);
  }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .chk input { accent-color: var(--accent); width: 16px; height: 16px; }

  .btn {
    display: block; width: 100%; padding: 14px;
    border: none; border-radius: 10px;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; margin-top: 24px; }
  .item { border: 1px solid var(--border); border-radius: 10px; background: #fff; overflow: hidden; }
  .item img { display: block; width: 100%; height: 120px; object-fit: contain; background: #f4f4f4; }
  .item .name { font-size: 12px; color: var(--muted); padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .tag { font-size: 12px; padding: 0 10px 8px; color: var(--text); }
  .item .tag.ok { color: #2a7a3b; }

  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>批量加白边并署名 <span style="font-size:12px;color:#6b6b6b;">v3</span></h1>
  <p class="sub">拖入或选择多张照片，自动加 130px 白边、在右下角署名并编号，处理完自动下载。</p>

  <div class="card">
    <h2>1 · 批量导入照片</h2>
    <div class="drop" id="drop">
      <b>点击选择</b> 或把多张照片拖到这里<br>
      <span style="font-size:12px;">支持 JPG / PNG / WebP，一次性可导入多张</span>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </div>

  <div class="card">
    <h2>2 · 设置（可选）</h2>
    <div class="row">
      <label>署名文字</label>
      <input type="text" id="labelText" value="25美术学2班余欣霖">
    </div>
    <div class="row">
      <label>边框宽度</label>
      <input type="number" id="bw" value="130" min="0" max="500">
    </div>
    <div class="row">
      <label>起始编号</label>
      <input type="number" id="startNum" value="1" min="1">
    </div>
    <div class="chk" style="margin-top:14px;">
      <input type="checkbox" id="autoDownload" checked> 导入后自动处理并下载
    </div>
  </div>

  <div class="card">
    <h2>3 · 处理</h2>
    <button class="btn" id="go" disabled>重新处理</button>
    <p class="hint" id="status">等待导入照片…</p>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const drop = $('drop'), fileInput = $('file');
  const labelText = $('labelText'), bw = $('bw'), startNum = $('startNum');
  const autoDownload = $('autoDownload'), go = $('go'), status = $('status'), grid = $('grid');
  let files = [];
  let busy = false;

  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => { addFiles(e.target.files); fileInput.value = ''; });
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

  function addFiles(list) {
    const arr = [...list].filter(f => /^image\/(jpeg|png|webp)$/i.test(f.type) || /\.(jpe?g|png|webp)$/i.test(f.name));
    if (!arr.length) { status.textContent = '未找到支持的图片文件'; return; }
    files = files.concat(arr);
    renderGrid();
    go.disabled = files.length === 0;
    status.textContent = '已导入 ' + files.length + ' 张照片';
    if (autoDownload.checked) processAll();
  }

  function renderGrid() {
    grid.innerHTML = '';
    files.forEach((f, i) => {
      const item = document.createElement('div');
      item.className = 'item';
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = f.name;
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = '编号 ' + (parseInt(startNum.value) + i);
      const rm = document.createElement('div');
      rm.style.cssText = 'font-size:12px;color:#b03a3a;padding:0 10px 8px;cursor:pointer;';
      rm.textContent = '移除';
      rm.onclick = () => { files.splice(i, 1); renderGrid(); go.disabled = files.length === 0; };
      item.append(img, name, tag, rm);
      grid.appendChild(item);
    });
  }

  function loadImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = url;
    });
  }

  async function processAll() {
    if (busy) return;
    if (!files.length) { status.textContent = '请先导入照片'; return; }
    busy = true;
    go.disabled = true;
    status.textContent = '处理中…';
    const label = labelText.value.trim() || '署名';
    const border = Math.max(0, parseInt(bw.value) || 0);
    const start = Math.max(1, parseInt(startNum.value) || 1);
    let done = 0;
    try {
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const img = await loadImage(f);
        const iw = img.naturalWidth, ih = img.naturalHeight;

        const c = document.createElement('canvas');
        c.width = iw + border * 2;
        c.height = ih + border * 2;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, border, border);

        const text = label + (start + i);
        const fontSize = Math.round(border * 0.50);
        const marginRight = Math.round(border * 0.5);
        const textX = c.width - marginRight;
        const textY = c.height - border / 2;
        ctx.font = '600 ' + fontSize + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#1f1f1f';
        ctx.fillText(text, textX, textY);

        const a = document.createElement('a');
        a.download = f.name.replace(/(\.[^.]+)$/, '') + '_' + (start + i) + '$1';
        a.href = c.toDataURL('image/png');
        a.click();

        const item = grid.children[i];
        if (item) {
          const tag = item.querySelector('.tag');
          if (tag) { tag.textContent = '已完成 · ' + (start + i); tag.classList.add('ok'); }
        }

        done++;
        status.textContent = '处理中… ' + done + ' / ' + files.length;
        await new Promise(r => setTimeout(r, 80));
      }
      status.textContent = '全部完成！共处理 ' + done + ' 张，已自动下载到浏览器默认下载目录。';
    } catch (err) {
      status.textContent = '出错了：' + err.message;
    } finally {
      busy = false;
      go.disabled = files.length === 0;
    }
  }

  go.addEventListener('click', processAll);
  startNum.addEventListener('change', renderGrid);
</script>
</body>
</html>
